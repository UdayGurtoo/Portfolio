name: Scheduled Market Quotes Sync

on:
  schedule:
    # 1. Indian Market Trading Hours (Mon-Fri 09:15-15:30 IST / 03:45-10:00 UTC)
    - cron: '*/15 4-9 * * 1-5'
    # 2. Indian Market 1-Hr Post-Close Final Check & Google Finance Verification (Mon-Fri 16:30 IST / 11:00 UTC)
    - cron: '0 11 * * 1-5'
    # 3. US Market Trading Hours (Mon-Fri 09:30-16:00 EST / 14:30-21:00 UTC)
    - cron: '*/15 14-20 * * 1-5'
    # 4. US Market 1-Hr Post-Close Final Check & Google Finance Verification (Mon-Fri 17:00 EST / 22:00 UTC)
    - cron: '0 22 * * 1-5'
    # 5. Mutual Funds Daily 8:00 AM IST NAV Update (Tue-Sat 08:00 IST / 02:30 UTC)
    - cron: '30 2 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Market-Aware Quotes & Verify Google Finance
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/update-quotes.js --force
          else
            node scripts/update-quotes.js
          fi

      - name: Commit and Push to main and gh-pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add quotes.json app.js
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Automated market sync & Google Finance verification [skip ci]"
            git push origin main
            git checkout gh-pages
            git merge main --ff-only || git merge main -m "merge: automated market sync"
            git push origin gh-pages
          else
            echo "No changes in quotes.json or app.js"
          fi
